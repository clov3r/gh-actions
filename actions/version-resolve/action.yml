name: Version Resolve
description: Generates a semantic version tag via dry-run + optional manual override.

inputs:
  github_token:
    description: "GitHub token for tagging"
    required: true
  version_override:
    description: "Force a specific version (e.g., 1.0.0)"
    default: ""
  pre_release_branches:
    description: "Comma-separated pre-release branch patterns"
    default: ""

outputs:
  version:
    description: "Resolved version tag (e.g., v1.2.3)"
    value: ${{ steps.resolve.outputs.version }}
  previous_tag:
    description: "Previous tag for changelog generation"
    value: ${{ steps.tag_preview.outputs.previous_tag }}
  changelog:
    description: "Auto-generated changelog from tag action"
    value: ${{ steps.tag_preview.outputs.changelog }}

runs:
  using: composite
  steps:
    - name: Generate Tag Version (dry run)
      id: tag_preview
      uses: mathieudutour/github-tag-action@v6.2
      with:
        github_token: ${{ inputs.github_token }}
        dry_run: true
        fetch_all_tags: true
        custom_tag: ${{ inputs.version_override || '' }}
        pre_release_branches: ${{ inputs.pre_release_branches }}

    - name: Resolve Version
      id: resolve
      shell: bash
      run: |
        if [ -n "${{ inputs.version_override }}" ]; then
          OVERRIDE="${{ inputs.version_override }}"
          TAG="v${OVERRIDE#v}"
        else
          TAG="${{ steps.tag_preview.outputs.new_tag }}"
        fi
        echo "version=$TAG" >> $GITHUB_OUTPUT
        echo "Resolved version: $TAG"
