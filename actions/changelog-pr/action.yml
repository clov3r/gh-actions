name: Changelog PR
description: Creates a PR to update CHANGELOG.md in the source repo.

inputs:
  version:
    description: "Version tag"
    required: true
  changelog:
    description: "Changelog body (markdown)"
    required: true
  project_name:
    description: "Project name for fallback heading (e.g., QSCM)"
    required: true
  pr_token:
    description: "Token for creating PRs"
    required: true

runs:
  using: composite
  steps:
    - name: Update CHANGELOG.md and open PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.pr_token }}
        TAG: ${{ inputs.version }}
        CHANGELOG: ${{ inputs.changelog }}
        PROJECT_NAME: ${{ inputs.project_name }}
      run: |
        DATE=$(date +%Y-%m-%d)
        BRANCH="chore/changelog-${TAG}"

        if grep -qF "## ${TAG}" CHANGELOG.md 2>/dev/null; then
          echo "CHANGELOG.md already contains ${TAG} — skipping"
          exit 0
        fi

        git checkout -b "$BRANCH"

        {
          if [ -f CHANGELOG.md ]; then
            HEAD_LINE=$(head -1 CHANGELOG.md)
            echo "$HEAD_LINE"
            echo ""
          else
            echo "# ${PROJECT_NAME} Changelog"
            echo ""
          fi
          printf '%s\n' "## ${TAG} (${DATE})"
          printf '\n'
          printf '%s\n' "$CHANGELOG"
          printf '\n'
          if [ -f CHANGELOG.md ]; then
            tail -n +2 CHANGELOG.md
          fi
        } > CHANGELOG.md.tmp
        mv CHANGELOG.md.tmp CHANGELOG.md

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add CHANGELOG.md
        if git diff --cached --quiet; then
          echo "No changelog changes to commit"
        else
          git commit -m "docs: update CHANGELOG.md for ${TAG}"
          git push origin "$BRANCH"
          gh pr create \
            --title "docs: update CHANGELOG.md for ${TAG}" \
            --base main \
            --head "${BRANCH}" \
            --body "Auto-generated changelog update for release ${TAG}."
        fi
