name: Pipeline

on:
  workflow_call:
    inputs:
      environment:
        description: "Pipeline environment"
        type: string
        required: true
      version_override:
        description: "Force a specific version"
        type: string
        default: ""
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
      PR_OPENER:
        required: false
      GH_PACKAGE_TOKEN:
        required: false
      KEYCLOAK_CLIENT_SECRET:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      service_name: ${{ steps.parse.outputs.service_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Parse pipeline config
        id: parse
        shell: bash
        run: |
          CONFIG=".github/pipeline.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Missing $CONFIG"
            exit 1
          fi
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          echo "service_name=$(yq -r '.service_name' $CONFIG)" >> $GITHUB_OUTPUT
          echo "Parsed service: $(yq -r '.service_name' $CONFIG)"

  report:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - run: echo "Service=${{ needs.config.outputs.service_name }} Env=${{ inputs.environment }}"
