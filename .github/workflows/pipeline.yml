name: Pipeline

on:
  workflow_call:
    inputs:
      environment:
        description: "Pipeline environment"
        type: string
        required: true
      version_override:
        description: "Force a specific version"
        type: string
        default: ""
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
      PR_OPENER:
        required: false
      GH_PACKAGE_TOKEN:
        required: false
      KEYCLOAK_CLIENT_SECRET:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      service_name: ${{ steps.parse.outputs.service_name }}
      has_go_test: ${{ steps.parse.outputs.has_go_test }}
      go_test_json: ${{ steps.parse.outputs.go_test_json }}
      run_tests: ${{ steps.flags.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v6

      - name: Parse pipeline config
        id: parse
        shell: bash
        run: |
          CONFIG=".github/pipeline.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Missing $CONFIG"
            exit 1
          fi
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          echo "service_name=$(yq -r '.service_name' $CONFIG)" >> $GITHUB_OUTPUT

          GO_TEST=$(yq -o=json '.tests.go // null' $CONFIG | jq -c '.')
          echo "go_test_json=$GO_TEST" >> $GITHUB_OUTPUT
          echo "has_go_test=$( [ "$GO_TEST" != "null" ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Set environment flags
        id: flags
        shell: bash
        run: |
          ENV="${{ inputs.environment }}"
          case "$ENV" in
            pr|qa|preproduction)
              echo "run_tests=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "run_tests=false" >> $GITHUB_OUTPUT
              ;;
          esac

  go-test:
    needs: config
    if: needs.config.outputs.run_tests == 'true' && needs.config.outputs.has_go_test == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: ${{ fromJson(needs.config.outputs.go_test_json).dirs }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ fromJson(needs.config.outputs.go_test_json).version }}
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Run unit tests (${{ matrix.dir }})
        run: cd ${{ matrix.dir }} && go test ./... -timeout 120s
