name: Pull Request Tests
on:
  pull_request:
    branches: [main, release/next]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [hotfix/**]

jobs:
  pipeline:
    if: github.event_name == 'push' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'test-draft')
    uses: clov3r/gh-actions/.github/workflows/pipeline.yml@v1
    with:
      environment: pr
    secrets: inherit
